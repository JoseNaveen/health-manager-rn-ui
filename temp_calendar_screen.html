<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incident Calendar View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-white">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="flex size-12 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</div>
<h1 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">Incident Calendar</h1>
<div class="flex size-12 items-center justify-end">
<button class="flex items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 p-2 text-primary hover:bg-primary/30 transition-colors">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
</div>
</div>
</header>
<main class="max-w-md mx-auto pb-12">
<!-- Calendar Picker Section -->
<section class="p-4">
<div class="bg-white dark:bg-slate-900/50 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-800/50">
<div class="flex items-center justify-between mb-4 px-2">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-xl">chevron_left</span>
</button>
<p class="text-base font-bold">October 2023</p>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 mb-2">
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">S</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">M</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">T</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">W</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">T</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">F</p>
<p class="text-slate-400 dark:text-slate-500 text-[12px] font-bold text-center">S</p>
</div>
<div class="grid grid-cols-7 gap-y-1">
<!-- Placeholder days for alignment -->
<div class="h-10"></div><div class="h-10"></div><div class="h-10"></div>
<!-- Days -->
<button class="h-10 w-full flex flex-col items-center justify-center relative">
<span class="text-sm font-medium">1</span>
<div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div>
</button>
<button class="h-10 w-full flex flex-col items-center justify-center relative">
<span class="text-sm font-medium">2</span>
</button>
<button class="h-10 w-full flex flex-col items-center justify-center relative">
<span class="text-sm font-medium">3</span>
<div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div>
</button>
<button class="h-10 w-full flex flex-col items-center justify-center relative">
<span class="text-sm font-medium">4</span>
</button>
<!-- Active Day -->
<button class="h-10 w-full flex flex-col items-center justify-center relative">
<div class="absolute inset-0 m-auto size-9 bg-primary rounded-full flex items-center justify-center">
<span class="text-sm font-bold text-white">5</span>
</div>
<div class="absolute bottom-1 size-1 bg-white rounded-full"></div>
</button>
<!-- Row 2 -->
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">6</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center relative"><span class="text-sm font-medium">7</span><div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">8</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">9</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">10</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center relative"><span class="text-sm font-medium">11</span><div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">12</span></button>
<!-- Row 3 -->
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">13</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">14</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">15</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center relative"><span class="text-sm font-medium">16</span><div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">17</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">18</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">19</span></button>
<!-- Row 4 -->
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">20</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center relative"><span class="text-sm font-medium">21</span><div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">22</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">23</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center relative"><span class="text-sm font-bold text-primary">24</span><div class="absolute bottom-1.5 size-1 bg-primary rounded-full"></div></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">25</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">26</span></button>
<!-- Row 5 -->
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">27</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">28</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">29</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">30</span></button>
<button class="h-10 w-full flex flex-col items-center justify-center"><span class="text-sm font-medium">31</span></button>
</div>
</div>
</section>
<!-- Section Header -->
<div class="flex items-center justify-between px-6 pt-2 pb-2">
<h3 class="text-lg font-bold leading-tight tracking-tight">Tuesday, Oct 24</h3>
<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">2 Incidents</span>
</div>
<!-- Incident List -->
<div class="px-4 space-y-3">
<!-- Incident Card 1 -->
<div class="flex items-center gap-4 bg-white dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800/50 shadow-sm">
<div class="flex items-center justify-center rounded-xl bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-12">
<span class="material-symbols-outlined text-2xl">neurology</span>
</div>
<div class="flex flex-col flex-1 justify-center min-w-0">
<p class="text-base font-bold leading-tight truncate">Migraine</p>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="material-symbols-outlined text-sm text-slate-400">schedule</span>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">2:00 PM</p>
</div>
</div>
<div class="shrink-0 flex flex-col items-end">
<span class="px-2 py-1 rounded-lg bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400 text-[11px] font-bold uppercase tracking-wider">
                        Intensity 7
                    </span>
<p class="text-[10px] text-slate-400 mt-1">Severe</p>
</div>
</div>
<!-- Incident Card 2 -->
<div class="flex items-center gap-4 bg-white dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800/50 shadow-sm">
<div class="flex items-center justify-center rounded-xl bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-12">
<span class="material-symbols-outlined text-2xl">psychology</span>
</div>
<div class="flex flex-col flex-1 justify-center min-w-0">
<p class="text-base font-bold leading-tight truncate">Tension Headache</p>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="material-symbols-outlined text-sm text-slate-400">schedule</span>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">9:30 AM</p>
</div>
</div>
<div class="shrink-0 flex flex-col items-end">
<span class="px-2 py-1 rounded-lg bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400 text-[11px] font-bold uppercase tracking-wider">
                        Intensity 3
                    </span>
<p class="text-[10px] text-slate-400 mt-1">Mild</p>
</div>
</div>
</div>
<!-- Tomorrow Preview Placeholder -->
<div class="mt-8 px-6">
<h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Upcoming Log</h4>
<div class="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-3xl text-slate-300 dark:text-slate-700 mb-2">event_available</span>
<p class="text-sm font-medium text-slate-400">No incidents planned for tomorrow.</p>
<button class="mt-4 text-xs font-bold text-primary hover:underline">Log Preventive Entry</button>
</div>
</div>
</main>
<!-- Bottom Navigation (iOS Style) -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 pb-8 pt-2">
<div class="max-w-md mx-auto flex justify-around items-center">
<button class="flex flex-col items-center gap-1 text-slate-400">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">calendar_month</span>
<span class="text-[10px] font-bold">Calendar</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-400">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[10px] font-medium">Insights</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-400">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</nav>
</body></html>
